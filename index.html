<!DOCTYPE html> 
<!-- Declara que este documento usa HTML5 -->

<html lang="pt-BR">
<!-- Elemento raiz da página. lang="pt-BR" define o idioma  -->

<head>
    <!-- Informações de bastidores: não aparecem diretamente na tela  -->

    <meta charset="UTF-8"> <!-- Codificação de caracteres, garante acentos corretos -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Ativa a responsividade em dispositivos móveis -->

    <title>Escola Digital Livre</title> <!-- Titulo exibido na aba do navegador -->

    <link rel="stylesheet" href="style.css"> 
    <!-- Conecta o arquivo de estilos (CSS) -->
</head>
<body>
    <!-- Tudo que o usuário vê e interage fica aqui -->

    <header class="header">
        <!-- Tag semântica: indica o cabeçalho da página -->

        <div class="header-container">
        <!-- Container que agrupa e centraliza o conteúdo do header -->

            <a href="#" class="logo">
                <!-- Logo clicável, leva para a home -->

                <img src="./assets/logo.png" alt="Logo Educação Digital Livre">
                <!-- img: adiciona imagem / src: caminho da imagem / alt: legenda da imagem -->

                <span></span>
                <p>Isso é um parágrafo</p>
            </a>
        </div>
    </header>
</body>
</html>
